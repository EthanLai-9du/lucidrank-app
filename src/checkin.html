<!doctype html>
<html lang="zh-Hans" data-lang="sc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LucidRank · Check-in</title>
<link rel="stylesheet" href="css/app.css">
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
</head>
<body class="ci-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gradStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc46b"/><stop offset=".5" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff2e63"/></linearGradient></defs></svg>
<main class="ci-win" id="device">
  <header class="ci-top">
    <span data-i18n="ci.day"></span>
    <span class="ci-gamenote" id="ciGame" hidden></span>
    <span class="dt-timer num" id="ciTimer">0.0 s</span>
  </header>
  <div class="ci-progress" id="ciProg"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="ci-stage" id="ciStage"></div>
  <footer class="ci-nav">
    <button class="ci-back" id="ciBack" data-i18n="ci.back" disabled></button>
    <button class="ci-skip" id="ciSkip" data-i18n="ci.skip"></button>
    <span class="ci-count num" id="ciCount">1 / 8</span>
  </footer>
</main>
<script src="js/checkin.js"></script>
</body>
</html>

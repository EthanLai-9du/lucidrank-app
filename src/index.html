<!doctype html>
<html lang="zh-Hans" data-lang="sc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LucidRank</title>
<link rel="stylesheet" href="css/app.css">
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
</head>
<body class="main-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gradStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc46b"/><stop offset=".5" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ff2e63"/></linearGradient></defs></svg>
<aside class="side">
  <div class="brand" data-drag-area><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.4"/><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#ff6a3d"/></svg><span class="wm"><b>Lucid</b>Rank</span></div>
  <nav class="nav" id="nav">
    <button data-view="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><span data-i18n="nav.today"></span></button>
    <button data-view="matches"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="nav.matches"></span></button>
    <button data-view="insights"><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg><span data-i18n="nav.insights"></span></button>
    <button data-view="week"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.4 2.4 4.6-5"/></svg><span data-i18n="nav.week"></span></button>
    <button data-open="lineups"><svg viewBox="0 0 24 24"><path d="M5 18c3-9 8-12 14-12"/><circle cx="5" cy="18" r="1.6"/><path d="M16 4l3 2-2 3"/></svg><span data-i18n="nav.lineups"></span><em class="ext">↗</em></button>
    <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></svg><span data-i18n="nav.settings"></span></button>
  </nav>
  <div class="side-foot">
    <div class="game-pill" id="gamePill"></div>
    <p class="tagline" data-i18n="app.tagline"></p>
  </div>
</aside>
<div class="main-col">
<header class="tbar" data-titlebar="min,max,close" data-close-label="tb.closeMain"></header>
<main class="content" id="content">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-matches"></section>
  <section class="view" id="v-insights"></section>
  <section class="view" id="v-week"></section>
  <section class="view" id="v-settings"></section>
  <section class="view inline-host" id="v-inline"></section>
</main>
</div>
<script src="js/stats.js"></script>
<script src="js/checkin.js"></script>
<script src="js/lineups-data.js"></script>
<script src="js/lineups.js"></script>
<script src="js/main.js"></script>
<script src="js/updater.js"></script>
</body>
</html>

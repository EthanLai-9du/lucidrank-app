<!doctype html>
<html class="web" lang="zh-Hans" data-lang="sc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LucidRank</title>
<meta name="description" content="LucidRank desktop: health check-in, match log, insights and weekly goal for VALORANT / CS2 players. Guest data stays on this device; optional account cloud sync.">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LucidRank">
<meta name="format-detection" content="telephone=no">

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=0.1.7h">
<link rel="stylesheet" href="css/fonts.css?v=0.1.7h">
<link rel="stylesheet" href="css/urban.css?v=0.1.7h">
<!-- shared with the desktop app (copied unchanged from lucidrank-app/src/js) -->
<script src="js/i18n.js?v=0.1.7h"></script>
<!-- Native account transport and updater -->
<script src="js/native-adapter.js?v=0.1.7h"></script>
<!-- shared -->
<script src="js/upgrade-i18n.js?v=0.1.7h"></script>
<script src="js/core.js?v=0.1.7h"></script>
<script src="js/catalog.js?v=0.1.7h"></script>
<link rel="stylesheet" href="css/native.css">
</head>
<body class="main-body">
<!-- the shared ring / progress styles reference #gradStroke; on the web it is one flat colour -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gradStroke"><stop offset="0" stop-color="#f04452"/><stop offset="1" stop-color="#f04452"/></linearGradient></defs></svg>
<aside class="side">
  <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v12h6v5H4z" fill="currentColor"/><path d="M13 4h5l4 4v5l-3 3 4 5h-7l-4-6h4l1-1V9h-4z" fill="currentColor"/><path d="m3 2 5 0-3 3H0z" fill="#ff344a"/></svg><span class="wm"><b>Lucid</b>Rank</span></div>
  <nav class="nav" id="nav">
    <button data-view="today" class="on"><span class="nav-index" aria-hidden="true">01</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><span data-i18n="nav.today"></span></button>
    <button data-view="matches"><span class="nav-index" aria-hidden="true">02</span><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="nav.matches"></span></button>
    <button data-view="insights"><span class="nav-index" aria-hidden="true">03</span><svg viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg><span data-i18n="nav.insights"></span></button>
    <button data-view="week"><span class="nav-index" aria-hidden="true">04</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.4 2.4 4.6-5"/></svg><span class="l-long" data-i18n="nav.week"></span><span class="l-short" data-i18n="tab.week"></span></button>
    <button data-open="lineups"><span class="nav-index" aria-hidden="true">05</span><svg viewBox="0 0 24 24"><path d="M5 18c3-9 8-12 14-12"/><circle cx="5" cy="18" r="1.6"/><path d="M16 4l3 2-2 3"/></svg><span class="l-long" data-i18n="nav.lineups"></span><span class="l-short" data-i18n="tab.lineups"></span></button>
    <button data-view="library"><span class="nav-index" aria-hidden="true">06</span><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 5v14M12 9h5M12 13h5"/></svg><span data-i18n="nav.library"></span></button>
    <button data-view="training"><span class="nav-index" aria-hidden="true">07</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span data-i18n="nav.training"></span></button>
    <button data-view="settings"><span class="nav-index" aria-hidden="true">08</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></svg><span data-i18n="nav.settings"></span></button>
  </nav>
  <div class="side-foot">
    <div class="game-pill" id="gamePill" hidden></div>
    <p class="tagline" data-i18n="app.tagline"></p>
  </div>
</aside>
<div class="main-col">
<header class="tbar" data-titlebar="min,max,close" data-close-label="tb.closeMain"></header>
<div class="app-toolbar"><a class="btn ghost sm website-back" href="https://lucidrank.pages.dev/" data-i18n="website.back">← 返回官网</a><a class="toolbar-brand" href="https://lucidrank.pages.dev/">LucidRank / PLAYER JOURNAL</a><button class="btn ghost sm" id="account-open" type="button">登录 / 雲端同步 / Sign in</button><a class="btn ghost sm" id="developer-open" href="https://lucidrank.pages.dev/app/developer.html" hidden>开发者工作台</a></div>
<main class="content" id="content">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-matches"></section>
  <section class="view" id="v-insights"></section>
  <section class="view" id="v-week"></section>
  <section class="view" id="v-library"></section>
  <section class="view" id="v-training"></section>
  <section class="view" id="v-settings"></section>
  <section class="view inline-host" id="v-inline"></section>
</main>
</div>
<noscript><p style="padding:24px">LucidRank needs JavaScript.</p></noscript>

<script src="js/stats.js?v=0.1.7h"></script>

<script src="js/ocr.js?v=0.1.7h"></script>
<script src="js/account.js?v=0.1.7h"></script>
<script src="js/main.js?v=0.1.7h"></script>
<!-- Native account transport and updater -->
<script src="js/updater.js"></script>
<script src="js/urban.js?v=0.1.7h"></script>

</body>
</html>

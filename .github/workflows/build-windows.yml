name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps (Tauri CLI only)
        run: npm ci

      - name: Build NSIS + MSI (+ signed updater artifacts) and publish release v<version from tauri.conf.json>
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign key for the in-app updater (pubkey is in tauri.conf.json → plugins.updater.pubkey)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: LucidRank v__VERSION__
          releaseBody: |
            LucidRank Windows 桌面版（原型，安装包未做代码签名）。
            下载下面的 `LucidRank_*_x64-setup.exe` 安装即可（覆盖安装旧版本，数据会保留）。SmartScreen 提示时点「更多信息」→「仍要运行」。
            从 v0.1.2 开始应用内可以直接更新（设置 → 更新）；v0.1.1 及更早的版本需要手动装一次 v0.1.2。
            安全：只检查进程列表里游戏是否在运行；不读写游戏内存、不注入、不做覆盖层、不截屏、不模拟输入。
          releaseDraft: false
          # full releases (not pre-releases) so .../releases/latest/download/latest.json resolves for the updater
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi

      - name: Fix up the release's latest.json (short trilingual notes, public download URLs)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release download "v$V" -R "$GITHUB_REPOSITORY" -p latest.json -D upd --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" > upd/release.json
          node tools/fix-latest-json.js upd/latest.json upd/release.json src-tauri/update-notes.txt
          gh release upload "v$V" -R "$GITHUB_REPOSITORY" upd/latest.json --clobber

      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LucidRank-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
          if-no-files-found: error
